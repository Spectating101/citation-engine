[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citation-engine"
version = "0.1.0"
description = "Domain-neutral evidence, citation, verification, authority, and receipt substrate."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
